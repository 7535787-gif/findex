services:
  - type: web
    name: findex-lab07
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: INDEX_PATH
        value: /app/data-index.bin
      - key: LOG_LEVEL
        value: INFO
      - key: SEARCH_MODE
        value: def
      - key: EMBEDDINGS_PATH
        value: /app/embeddings.npy
      - key: EMBEDDING_MODEL
        value: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
